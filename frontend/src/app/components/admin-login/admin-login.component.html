<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 shadow-xl p-8 space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex w-16 h-16 rounded-2xl overflow-hidden shadow-lg shadow-orange-500/30 border-2 border-orange-300 bg-white items-center justify-center">
        <img src="avatar.png" alt="RajMaster Portal Logo" class="w-full h-full object-cover" />
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Admin Portal</h2>
      <p class="text-xs text-slate-500">Rajasthan Administrative & Geographic Master</p>
    </div>

    <!-- Session Expired Notice -->
    <div *ngIf="sessionNotice" class="p-3 bg-amber-50 border border-amber-300 rounded-xl text-xs text-amber-900 flex items-center space-x-2">
      <span class="text-base">⚠️</span>
      <span class="font-semibold">{{ sessionNotice }}</span>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 flex items-center space-x-2">
      <svg class="w-4 h-4 shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onLogin($event)" (submit)="$event.preventDefault()" class="space-y-4">
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Username / Mobile</label>
        <div class="relative">
          <input type="text" [(ngModel)]="username" name="username" required
                 placeholder="8946919241"
                 class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 text-sm outline-none transition-all">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
        <div class="relative">
          <input type="password" [(ngModel)]="password" name="password" required
                 placeholder="••••••"
                 class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 text-sm outline-none transition-all">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading"
              class="w-full py-3.5 rounded-xl bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-700 hover:to-amber-700 text-white font-bold text-sm shadow-md hover:shadow-lg transition-all disabled:opacity-50 flex items-center justify-center space-x-2">
        <span *ngIf="!isLoading">Sign In to Admin Portal</span>
        <span *ngIf="isLoading" class="flex items-center space-x-2">
          <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
          <span>Authenticating...</span>
        </span>
      </button>
    </form>

    <!-- Back to Public Chat Link & Developer Details -->
    <div class="text-center pt-2 space-y-2">
      <div>
        <a routerLink="/" class="text-xs text-slate-500 hover:text-orange-600 font-semibold inline-flex items-center space-x-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Return to Public AI Chat</span>
        </a>
      </div>
      <div class="pt-2 border-t border-slate-100 text-[11px] text-slate-400 flex items-center justify-center space-x-1.5">
        <span>Engineered by</span>
        <a href="https://rohitjain-resume.vercel.app/" target="_blank" rel="noopener noreferrer" class="font-bold text-orange-600 hover:underline">Rohit Jain</a>
        <span>•</span>
        <a href="https://rohitjain-resume.vercel.app/" target="_blank" rel="noopener noreferrer" class="text-slate-600 hover:underline">Resume & Portfolio ↗</a>
      </div>
    </div>
  </div>
</div>
