<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Shape -->
  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#bgGrad)" filter="url(#glow)"/>
  <rect x="14" y="14" width="172" height="172" rx="36" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>

  <!-- Rajasthan Fort Silhouette / Crown -->
  <path d="M50 125 L50 90 L60 90 L60 80 L70 80 L70 90 L85 90 L85 75 L95 75 L95 65 L105 65 L105 75 L115 75 L115 90 L130 90 L130 80 L140 80 L140 90 L150 90 L150 125 Z" fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Central Star / Gateway Arch -->
  <path d="M85 125 Q100 100 115 125 Z" fill="#7C2D12"/>
  <circle cx="100" cy="98" r="6" fill="#FFFFFF"/>

  <!-- Typography: RAJ -->
  <text x="100" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">RAJ</text>
  <text x="100" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FEF08A" text-anchor="middle" letter-spacing="1">MASTER AI</text>
</svg>
